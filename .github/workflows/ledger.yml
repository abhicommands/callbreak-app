name: Ledger

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: Cloudflare deployment environment
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

jobs:
  verify:
    name: Verify ledger
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm exec playwright -- install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run deploy:check -- --env ""
      - run: npm run deploy:check -- --env preview

  deploy:
    name: Publish ${{ inputs.target }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.target }}
      url: ${{ steps.release.outputs.url }}
    concurrency:
      group: ledger-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy with Wrangler
        id: release
        shell: bash
        run: |
          case "$TARGET" in
            preview) wrangler_env=preview; worker_name=callbreak-ledger-preview ;;
            production) wrangler_env=""; worker_name=callbreak-ledger ;;
            *) echo "Unknown deployment target." >&2; exit 1 ;;
          esac
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Cloudflare credentials are missing from the $TARGET environment." >&2
            exit 1
          fi
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/ledger-deploy.jsonl"
          npm exec wrangler -- deploy --env "$wrangler_env"
          url=$(jq -ers --arg name "$worker_name" '
            last(.[] | select(.type == "deploy") | .targets[]? |
              select(startswith("https://" + $name + ".") and endswith(".workers.dev")))
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
        env:
          TARGET: ${{ inputs.target }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
      - name: Smoke-test the deployed Worker
        run: node scripts/check-worker.js "$WORKER_URL"
        env:
          WORKER_URL: ${{ steps.release.outputs.url }}
